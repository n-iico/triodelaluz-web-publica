name: Publicar sitio Trío

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Extraer sitio público
        run: |
          mkdir -p _site
          unzip -q site-publico.zip -d _site
          test -f _site/index.html
          test ! -d _site/equipo/proyecto
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.1
